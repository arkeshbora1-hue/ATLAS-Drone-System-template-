[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-drone"
version = "1.0.0"
description = "Onboard software for ATLAS, an autonomous delivery drone"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "pymavlink>=2.4.40"]

[project.optional-dependencies]
pi = ["vl53l1x>=0.0.5", "tflite-runtime>=2.14"]
sim = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
atlas = "atlas.app:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
